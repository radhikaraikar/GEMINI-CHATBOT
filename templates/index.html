<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern AI chatbot built with Flask and OpenAI.">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="app-shell">
        <section class="chat-card" aria-label="AI chatbot">
            <header class="chat-header">
                <div class="brand">
                    <div class="brand-icon">✦</div>
                    <div>
                        <h1>AI Assistant</h1>
                        <p><span class="status-dot"></span> Online</p>
                    </div>
                </div>

                <button id="clearChatBtn" class="icon-btn" type="button" title="Clear chat" aria-label="Clear chat">
                    🗑
                </button>
            </header>

            <div id="chatMessages" class="chat-messages" aria-live="polite">
                <div id="welcomeMessage" class="welcome">
                    <div class="welcome-icon">✦</div>
                    <h2>How can I help you?</h2>
                    <p>Ask me anything. I’m ready to help.</p>

                    <div class="suggestions">
                        <button class="suggestion" type="button">Explain Python in simple terms</button>
                        <button class="suggestion" type="button">Give me a project idea</button>
                        <button class="suggestion" type="button">Help me prepare for an interview</button>
                    </div>
                </div>
            </div>

            <div id="typingIndicator" class="typing hidden" aria-label="AI is typing">
                <span></span><span></span><span></span>
                <small>AI is thinking...</small>
            </div>

            <form id="chatForm" class="composer">
                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="8000"
                    placeholder="Message AI Assistant..."
                    autocomplete="off"
                    aria-label="Message"
                ></textarea>

                <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" title="Send">
                    ➤
                </button>
            </form>

            <p class="hint">Press <kbd>Enter</kbd> to send · <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
